<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图卷帘模式</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #main-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* 左侧控制面板 */
        #sidebar {
            width: 320px; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1010;
            padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute; left: 0; top: 0; bottom: 0;
        }
        #sidebar.collapsed { transform: translateX(-320px); }

        /* 独立折叠按钮 */
        #toggle-btn {
            position: absolute; top: 50%; left: 320px; transform: translateY(-50%);
            width: 24px; height: 50px; background: #1890ff; color: white;
            border-radius: 0 4px 4px 0; cursor: pointer; display: flex; align-items: center;
            justify-content: center; font-size: 14px; box-shadow: 2px 0 5px rgba(0,0,0,0.15);
            z-index: 1011; user-select: none; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
        }
        #toggle-btn:hover { background: #40a9ff; }
        #toggle-btn.collapsed { left: 0px; }

        h3 { margin-top: 0; color: #333; border-bottom: 2px solid #1890ff; padding-bottom: 8px; font-size: 15px;}
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; font-size: 13px; color: #555; }
        select, input[type="file"], button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 100%; box-sizing: border-box; }
        button { background: #1890ff; color: white; border: none; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #40a9ff; }
        .hint { font-size: 11px; color: #888; margin-top: -4px; line-height: 1.4; }

        /* 逐年时间轴专属样式 */
        .timeline-container { display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; padding: 12px; border-radius: 6px; border: 1px dashed #dddddd; }
        .timeline-slider-wrapper { display: flex; align-items: center; gap: 10px; }
        .timeline-slider-wrapper input[type="range"] { width: 100%; margin: 0; }
        .timeline-range-labels { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-top: -4px; }
        #current-year-display { color: #1890ff; font-weight: bold; font-size: 14px; text-align: center; margin-bottom: 2px; }

        /* 右侧地图容器 */
        #map-container {
            position: absolute; top: 0; left: 320px; right: 0; bottom: 0; z-index: 1;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #map-container.full-width { left: 0px; }

        /* 👑 关键层级修复：默认让 MapA 铺满并具有完整交互，MapB 默认不阻挡鼠标 */
        .map-instance { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #mapA { z-index: 10; pointer-events: auto; }
        #mapB { z-index: 20; pointer-events: none; display: none; } 
        #mapB .leaflet-pane { background: transparent !important; }
        #mapB .leaflet-control-container { display: none; }

        /* 卷帘线 */
        #swipe-bar { position: absolute; background-color: #1890ff; z-index: 1001; box-shadow: 0 0 8px rgba(0,0,0,0.4); display: none; }
        .swipe-vertical { width: 4px; height: 100%; top: 0; cursor: ew-resize; }
        .swipe-horizontal { height: 4px; width: 100%; left: 0; cursor: ns-resize; }

        #swipe-handle {
            position: absolute; background: #ffffff; border: 2px solid #1890ff; border-radius: 50%;
            width: 32px; height: 32px; top: 50%; left: 50%; margin-top: -16px; margin-left: -16px;
            display: flex; align-items: center; justify-content: center; font-weight: bold; color: #1890ff;
            font-size: 16px; user-select: none; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* 右侧悬浮分析工具箱 */
        #right-toolbox { position: absolute; top: 20px; right: 20px; z-index: 1020; display: flex; flex-direction: column; gap: 10px; }
        .tool-btn {
            background: white; color: #333; border: none; width: 40px; height: 40px; border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .tool-btn:hover { background: #f4f4f4; color: #1890ff; }
        .tool-btn.active { background: #1890ff; color: white; }
        .tool-btn:disabled { background: #f5f5f5; color: #ccc; cursor: not-allowed; box-shadow: none; }

        .property-popup table { border-collapse: collapse; width: 100%; margin-top: 5px; }
        .property-popup th, .property-popup td { border: 1px solid #ddd; padding: 4px 8px; font-size: 12px; }
        .property-popup th { background-color: #f5f5f5; text-align: left; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="sidebar">
            <div>
                <h3>基础多图源切换</h3>
                <div class="form-group">
                    <label for="basemap-select">选择影像服务商</label>
                    <select id="basemap-select">
                        <option value="esri" selected>Esri影像</option>
                        <option value="gaode">高分影像</option>
                        <option value="osm">OSM - 国际标准矢量</option>
                    </select>
                </div>
            </div>

            <div id="panel-timeline">
                <h3>影像历史时间轴</h3>
                <div class="timeline-container">
                    <div id="current-year-display">当前观测时期: 2026年</div>
                    <div class="timeline-slider-wrapper">
                        <input type="range" id="timeline-slider" min="2000" max="2026" value="2026" step="1">
                    </div>
                    <div class="timeline-range-labels">
                        <span>2000年</span>
                        <span>2013年</span>
                        <span>2026年</span>
                    </div>
                </div>
            </div>

            <hr style="width:100%; border:0; border-top:1px solid #eee; margin:0;">

            <div>
                <h3>地图卷帘模式</h3>
                <div class="form-group">
                    <label for="swipe-mode">卷帘模式</label>
                    <select id="swipe-mode">
                        <option value="off">关闭卷帘</option>
                        <option value="vertical">左右卷帘 (Vertical)</option>
                        <option value="horizontal">上下卷帘 (Horizontal)</option>
                    </select>
                </div>
            </div>

            <hr style="width:100%; border:0; border-top:1px solid #eee; margin:0;">

            <div>
                <h3>基准视图数据加载</h3>
                <div class="form-group">
                    <label>加载本地 Shapefile</label>
                    <input type="file" id="file-layerA" accept=".shp,.dbf,.shx" multiple>
                    <p class="hint">提示：按住 Ctrl 可同时框选上传 .shp 和 .dbf 文件</p>
                    <button id="btn-layerA">加载到基准视图</button>
                </div>
            </div>

            <div id="panel-layerB" style="display: none;">
                <h3>卷帘视图数据加载</h3>
                <div class="form-group">
                    <label>加载本地 Shapefile</label>
                    <input type="file" id="file-layerB" accept=".shp,.dbf,.shx" multiple>
                    <p class="hint">提示：按住 Ctrl 可同时框选上传 .shp 和 .dbf 文件</p>
                    <button id="btn-layerB">加载到卷帘视图</button>
                </div>
            </div>
        </div>

        <div id="toggle-btn" title="收起/展开面板">◀</div>

        <div id="right-toolbox">
            <button class="tool-btn" id="btn-view-prev" title="上一视图 (⏮️)" disabled>⏮️</button>
            <button class="tool-btn" id="btn-view-next" title="下一视图 (⏭️)" disabled>⏭️</button>
            <button class="tool-btn" id="btn-home" title="复位绵阳市中心">🏠</button>
            <button class="tool-btn" id="btn-measure-dist" title="空间测距">📏</button>
            <button class="tool-btn" id="btn-measure-area" title="面积测量">▱</button>
            <button class="tool-btn" id="btn-identify" title="属性识别模式">ℹ️</button>
        </div>

        <div id="map-container">
            <div id="mapA" class="map-instance"></div>
            <div id="mapB" class="map-instance"></div>
            <div id="swipe-bar"><div id="swipe-handle">↔</div></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/shapefile@0.6.6/dist/shapefile.js"></script>
    <script src="app.js"></script>
</body>
</html>
